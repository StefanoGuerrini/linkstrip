name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package release .app
        run: make app

      - name: Zip .app bundle
        run: |
          cd .build
          zip -ry LinkStrip.app.zip LinkStrip.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: .build/LinkStrip.app.zip
          generate_release_notes: true
          draft: false
          prerelease: false
