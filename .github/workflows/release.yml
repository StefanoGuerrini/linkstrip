name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-and-release:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show toolchain version
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package universal release .app
        run: make app-universal

      - name: Verify bundle architecture
        run: |
          file .build/LinkStrip.app/Contents/MacOS/LinkStrip
          file .build/LinkStrip.app/Contents/PlugIns/LinkStripShareExtension.appex/Contents/MacOS/LinkStripShareExtension

      - name: Verify codesign
        run: codesign --verify --deep --strict .build/LinkStrip.app

      - name: Build Firefox extension
        run: make firefox-extension

      - name: Zip .app bundle
        run: |
          cd .build
          zip -ry LinkStrip.app.zip LinkStrip.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .build/LinkStrip.app.zip
            .build/linkstrip-firefox-*.zip
            .build/linkstrip-firefox-*.xpi
          generate_release_notes: true
          draft: true
          prerelease: false
