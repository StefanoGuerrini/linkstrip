name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package release .app
        run: make app

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinkStrip.app
          path: .build/LinkStrip.app
